{{define "title"}}Servers · frps-deploy-manager{{end}}
{{define "content"}}
<div class="page-head">
  <h1>Servers</h1>
  <a class="btn primary" href="/servers/new">+ New server</a>
</div>
{{if .Data}}
<div class="cards">
  {{range .Data}}
  <a class="card" href="/servers/{{.ID}}">
    <div class="card-title">{{.Name}}</div>
    <div class="muted">{{.SSHUser}}@{{.Host}}:{{.SSHPort}}</div>
    <div class="muted">{{.Domain}}</div>
    <span class="badge">{{.Status}}</span>
  </a>
  {{end}}
</div>
{{else}}
<p class="muted">No servers yet. Server management UI arrives in M4.</p>
{{end}}
{{end}}
