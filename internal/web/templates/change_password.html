{{define "title"}}Đổi mật khẩu · iNut FRPS{{end}}
{{define "content"}}
<div class="login-card">
  <img src="/static/logo.png" alt="iNut FRPS" class="login-logo">
  <h1>Đổi mật khẩu</h1>
  <p class="muted">Bạn cần đặt mật khẩu mới trước khi tiếp tục.</p>
  {{if .Data}}<p class="error">{{.Data}}</p>{{end}}
  <form method="post" action="/change-password">
    <input type="hidden" name="_csrf" value="{{.CSRF}}">
    <label>Mật khẩu mới
      <input type="password" name="password" autocomplete="new-password" autofocus required>
    </label>
    <label>Nhập lại
      <input type="password" name="confirm" autocomplete="new-password" required>
    </label>
    <button class="btn primary" type="submit">Lưu mật khẩu</button>
  </form>
</div>
{{end}}
