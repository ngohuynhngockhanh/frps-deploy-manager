{{define "title"}}Đổi mật khẩu · iNut FRPS{{end}}
{{define "content"}}
<div class="page-canvas password-page">
  <section class="panel password-card">
    <span class="eyebrow">ACCOUNT SECURITY</span><h1>Đổi mật khẩu</h1><p class="muted">Đặt mật khẩu mới tối thiểu 8 ký tự trước khi tiếp tục.</p>
    {{if .Data}}<div class="notice error">{{.Data}}</div>{{end}}
    <form method="post" action="/change-password" class="stack-form">
      <input type="hidden" name="_csrf" value="{{.CSRF}}">
      <label><span>Mật khẩu mới</span><input type="password" name="password" minlength="8" autocomplete="new-password" autofocus required></label>
      <label><span>Nhập lại mật khẩu</span><input type="password" name="confirm" minlength="8" autocomplete="new-password" required></label>
      <button class="btn primary full" type="submit">Lưu mật khẩu mới</button>
    </form>
  </section>
</div>
{{end}}
